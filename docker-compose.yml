version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: alpine_panel
      MYSQL_USER: alpine
      MYSQL_PASSWORD: alpine123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  php:
    image: php:8.1-fpm
    volumes:
      - ./:/application
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./public:/application/public
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  docker-proxy:
    image: docker:dind
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  mysql_data:
